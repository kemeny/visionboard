name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # The iPhone Duo APIs ship in the iOS 27.1 SDK. On an older Xcode, build
      # without them so the rest of the app is still checked.
      - name: Build for the simulator
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS simulator SDK $SDK"
          EXTRA=()
          if [ "$(printf '%s\n' 27.1 "$SDK" | sort -V | head -1)" != "27.1" ]; then
            echo "::warning::iOS SDK $SDK is older than 27.1, building without the iPhone Duo APIs"
            EXTRA=(SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG)
          fi
          xcodebuild build \
            -project ios/VisionBoard.xcodeproj \
            -scheme VisionBoard \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            "${EXTRA[@]}"
